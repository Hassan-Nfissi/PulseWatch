spring:
  application:
    name: pulsewatch-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulsewatch_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:pulsewatch-google-client-id.apps.googleusercontent.com}
  monitoring:
    scheduler-rate-ms: 10000 # Evaluate active monitors every 10s
    default-timeout-seconds: 10
    user-agent: "PulseWatch-UptimeBot/1.0 (+https://pulsewatch.io)"
  mail:
    from: ${MAIL_FROM:alerts@pulsewatch.io}

server:
  port: ${PORT:8080}
  error:
    include-message: always
