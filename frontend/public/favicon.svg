<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pw-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="pw-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="pw-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#00f298" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="pw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base -->
  <rect width="100" height="100" rx="24" fill="#020617" />

  <!-- Outer Radar Circle -->
  <circle cx="50" cy="50" r="42" stroke="url(#pw-outer)" stroke-width="3.5" />

  <!-- Inner Radar Circle -->
  <circle cx="50" cy="50" r="32" stroke="url(#pw-inner)" stroke-width="2.5" opacity="0.8" />

  <!-- Reticle Crosshair Ticks -->
  <line x1="50" y1="18" x2="50" y2="24" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="76" x2="50" y2="82" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="50" x2="24" y2="50" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="50" x2="82" y2="50" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />

  <!-- Radar Satellite Hand at 2 o'clock -->
  <line x1="50" y1="50" x2="74" y2="26" stroke="#00f298" stroke-width="2.5" stroke-linecap="round" filter="url(#pw-glow)" />
  <circle cx="75" cy="25" r="5" stroke="#00f298" stroke-width="2" fill="#020617" filter="url(#pw-glow)" />
  <circle cx="75" cy="25" r="2" fill="#00f298" />

  <!-- Heartbeat / ECG Waveform -->
  <path d="M 18 50 L 36 50 L 41 42 L 48 64 L 54 28 L 60 58 L 65 47 L 70 50 L 82 50" 
        stroke="url(#pw-pulse)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#pw-glow)" />
</svg>
